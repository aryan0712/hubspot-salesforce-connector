name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A standard PostgreSQL image (distinct from the embedded cluster the test suite starts
    # itself) so the release migration step is exercised against a real server, not just the
    # bundled binary used for isolated per-file test databases.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_sync_test
          POSTGRES_USER: crm_sync
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_sync -d crm_sync_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_sync:test-only-password@localhost:5432/crm_sync_test
      DATABASE_SSL: "false"
      APP_ENCRYPTION_KEY: ci-only-encryption-key-with-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:test
      # Exercises the release (migration) step against a real, standard PostgreSQL server.
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      # GitHub-hosted ubuntu-latest runners ship Google Chrome; the suite uses it via
      # playwright-core (no browser download step needed).
      - run: npm run test:browser
      - run: npm run audit:deps
