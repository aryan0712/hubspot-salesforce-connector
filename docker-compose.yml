services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm_sync
      POSTGRES_USER: crm_sync
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - crm_sync_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_sync -d crm_sync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crm_sync_postgres:
